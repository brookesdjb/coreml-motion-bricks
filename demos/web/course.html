<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MotionBricks Course</title>
<style>
  :root { --bg: #11151a; --panel: rgba(17, 21, 26, 0.82); --text: #e6e9ee; --muted: #8b95a3; --accent: #4fd18b; --warn: #f2b84b; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #hud { position: fixed; top: 12px; left: 12px; background: var(--panel); padding: 10px 12px; border-radius: 8px; min-width: 220px; backdrop-filter: blur(6px); }
  #hud h1 { font-size: 13px; margin: 0 0 6px; font-weight: 600; }
  #hud .row { display: flex; justify-content: space-between; gap: 16px; }
  #hud .k { color: var(--muted); }
  #status.ok { color: var(--accent); } #status.bad { color: var(--warn); }
  #keys { position: fixed; bottom: 12px; left: 12px; background: var(--panel); padding: 8px 12px; border-radius: 8px; color: var(--muted); }
  #keys b { color: var(--text); font-weight: 600; }
  label { display: flex; gap: 6px; align-items: center; margin-top: 6px; color: var(--muted); }
</style>
</head>
<body>
<div id="hud">
  <h1>MotionBricks on Mac</h1>
  <div class="row"><span class="k">server</span><span id="status" class="bad">connecting…</span></div>
  <div class="row"><span class="k">state</span><span id="state">–</span></div>
  <div class="row"><span class="k">mode</span><span id="mode">–</span></div>
  <div class="row"><span class="k">near</span><span id="near">–</span></div>
  <div class="row"><span class="k">step / network</span><span id="perf">–</span></div>
  <label><input type="checkbox" id="auto" checked> auto-interact</label>
</div>
<div id="keys"><b>WASD</b> move · <b>Shift</b> run · <b>C</b> crouch · <b>Q</b> strafe · <b>[</b> style · <b>N</b> normal · <b>E</b> interact · <b>drag</b> orbit · <b>wheel</b> zoom</div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from "three";

// Server world is Z-up (x, y, z); three.js is Y-up. World (x, y, z) -> three (x, z, -y).
const toThree = (x, y, z) => new THREE.Vector3(x, z, -y);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2029);
scene.fog = new THREE.Fog(0x1a2029, 25, 70);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 200);

scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x30343a, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 50 });
scene.add(sun, sun.target);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x2a313b, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(200, 200, 0x3a4350, 0x323a45);
grid.position.y = 0.002;
scene.add(grid);

// ---- character: a sphere per joint and a capsule per bone ----
let parents = [], jointNames = [], bones = [], spheres = [];
// Frames are played back on the server's simulation clock, a little behind the newest frame,
// so uneven arrival (generation spikes, network) doesn't show as jitter.
const frames = [];
const PLAYBACK_DELAY = 0.045;  // covers the ~45 ms worst-case frame gap while a generation runs
let clockOffset = null;
let prevJ = null, currJ = null;
const boneMat = new THREE.MeshStandardMaterial({ color: 0xe8edf3, roughness: 0.55 });
const jointMat = new THREE.MeshStandardMaterial({ color: 0x4fd18b, roughness: 0.4 });
const unitCyl = new THREE.CylinderGeometry(1, 1, 1, 10);
const unitSphere = new THREE.SphereGeometry(1, 12, 10);

function boneRadius(name) {
  if (/Hand|Thumb|Index|Middle|Ring|Pinky|Eye|Jaw/.test(name)) return 0.008;
  if (/Spine|Chest|Hips/.test(name)) return 0.07;
  if (/Leg|Shin/.test(name)) return 0.05;
  if (/Arm|ForeArm|Neck/.test(name)) return 0.035;
  if (/Head/.test(name)) return 0.05;
  return 0.03;
}

function buildCharacter() {
  parents.forEach((p, j) => {
    const r = boneRadius(jointNames[j]);
    const s = new THREE.Mesh(unitSphere, jointMat);
    s.scale.setScalar(/Head$/.test(jointNames[j]) ? 0.11 : r * 1.15);
    s.castShadow = true;
    scene.add(s); spheres.push(s);
    if (p >= 0) {
      const b = new THREE.Mesh(unitCyl, boneMat);
      b.userData = { j, p, r };
      b.castShadow = true;
      scene.add(b); bones.push(b);
    }
  });
}

const up = new THREE.Vector3(0, 1, 0), tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3(), tmpD = new THREE.Vector3();
function jointAt(j, a) {
  const i = j * 3;
  const x = prevJ[i] + (currJ[i] - prevJ[i]) * a, y = prevJ[i + 1] + (currJ[i + 1] - prevJ[i + 1]) * a, z = prevJ[i + 2] + (currJ[i + 2] - prevJ[i + 2]) * a;
  return new THREE.Vector3(x, z, -y);
}
function pickFrames() {
  if (!frames.length) return 0;
  const t = performance.now() / 1000 - clockOffset - PLAYBACK_DELAY;
  while (frames.length > 2 && frames[1].t <= t) frames.shift();
  const a = frames[0], b = frames[1] ?? frames[0];
  prevJ = a.joints; currJ = b.joints;
  return b.t > a.t ? Math.min(1, Math.max(0, (t - a.t) / (b.t - a.t))) : 1;
}
function poseCharacter(alpha) {
  if (!currJ) return;
  const pts = parents.map((_, j) => jointAt(j, alpha));
  pts.forEach((p, j) => spheres[j].position.copy(p));
  for (const b of bones) {
    const { j, p, r } = b.userData;
    tmpA.copy(pts[j]); tmpB.copy(pts[p]);
    tmpD.subVectors(tmpA, tmpB);
    const len = tmpD.length();
    b.visible = len > 1e-4;
    b.position.addVectors(tmpA, tmpB).multiplyScalar(0.5);
    b.scale.set(r, len, r);
    b.quaternion.setFromUnitVectors(up, tmpD.normalize());
  }
  return pts[0];
}

// ---- scene objects from the server ----
const primMarkers = {};
function buildScene(msg) {
  for (const c of msg.cubes) {
    const [w, d, h] = c.size;
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
      new THREE.MeshStandardMaterial({ color: new THREE.Color(...c.color), roughness: 0.7 }));
    m.position.copy(toThree(...c.p));
    const [qx, qy, qz, qw] = c.q;
    m.quaternion.set(qx, qz, -qy, qw);
    m.castShadow = m.receiveShadow = true;
    scene.add(m);
  }
  for (const p of msg.primitives) {
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.9, 1.0, 40), new THREE.MeshBasicMaterial({ color: 0xf2b84b, transparent: true, opacity: 0.5, side: THREE.DoubleSide }));
    ring.rotation.x = -Math.PI / 2;
    ring.position.copy(toThree(...p.p)).setY(0.01);
    scene.add(ring);
    primMarkers[p.name] = ring;
  }
  parents = msg.parents; jointNames = msg.joints;
  buildCharacter();
}

// ---- networking ----
const statusEl = document.getElementById("status");
let ws;
function connect() {
  ws = new WebSocket(`ws://${location.hostname}:${Number(location.port) + 1}`);
  ws.onopen = () => { statusEl.textContent = "connected"; statusEl.className = "ok"; };
  ws.onclose = () => { statusEl.textContent = "disconnected – retrying"; statusEl.className = "bad"; setTimeout(connect, 1000); };
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "scene") { if (!bones.length) buildScene(msg); return; }
    const offset = performance.now() / 1000 - msg.t;
    // Track the fastest-arriving frame so late frames don't drag the clock; drift back slowly.
    clockOffset = clockOffset === null || offset < clockOffset ? offset : clockOffset + (offset - clockOffset) * 0.01;
    frames.push(msg);
    if (frames.length > 60) frames.shift();
    document.getElementById("state").textContent = msg.state;
    document.getElementById("mode").textContent = msg.mode;
    document.getElementById("near").textContent = msg.near.join(", ") || "–";
    document.getElementById("perf").textContent = `${msg.step_ms} / ${msg.gen_ms} ms (${msg.backend})`;
    for (const [name, ring] of Object.entries(primMarkers)) ring.material.color.set(msg.near.includes(name) ? 0x4fd18b : 0xf2b84b);
  };
}
connect();
const send = (o) => ws?.readyState === 1 && ws.send(JSON.stringify(o));
document.getElementById("auto").onchange = (e) => send({ type: "auto", on: e.target.checked });

// ---- input: camera-relative WASD ----
const keys = new Set();
let interactQueued = false;
addEventListener("keydown", (e) => {
  if (e.repeat) return;
  keys.add(e.code);
  const modes = { KeyC: "crouch", KeyQ: "strafe", BracketLeft: "style", KeyN: "normal" };
  if (modes[e.code]) send({ type: "mode", kind: modes[e.code] });
  if (e.code === "KeyE") interactQueued = true;
});
addEventListener("keyup", (e) => keys.delete(e.code));
addEventListener("blur", () => keys.clear());

let yaw = Math.PI / 2, pitch = 0.35, dist = 6, dragging = false;
renderer.domElement.addEventListener("pointerdown", (e) => { dragging = true; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener("pointerup", () => { dragging = false; });
renderer.domElement.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  yaw -= e.movementX * 0.006;
  pitch = Math.min(1.3, Math.max(0.05, pitch + e.movementY * 0.004));
});
addEventListener("wheel", (e) => { dist = Math.min(20, Math.max(2.5, dist * (1 + e.deltaY * 0.001))); }, { passive: true });

function sendInput() {
  // Camera forward on the ground, in server world coordinates (three (x, z) -> world (x, -z)).
  const fwd = [-Math.cos(yaw), Math.sin(yaw)];
  const right = [fwd[1], -fwd[0]];
  let f = (keys.has("KeyW") || keys.has("ArrowUp") ? 1 : 0) - (keys.has("KeyS") || keys.has("ArrowDown") ? 1 : 0);
  let r = (keys.has("KeyD") || keys.has("ArrowRight") ? 1 : 0) - (keys.has("KeyA") || keys.has("ArrowLeft") ? 1 : 0);
  let mv = [fwd[0] * f + right[0] * r, fwd[1] * f + right[1] * r];
  const n = Math.hypot(...mv);
  if (n > 0) mv = [mv[0] / n, mv[1] / n];
  send({ type: "input", move: mv, facing: fwd, run: keys.has("ShiftLeft") || keys.has("ShiftRight"), interact: interactQueued, active: keys.size > 0 });
  interactQueued = false;
}
setInterval(sendInput, 1000 / 60);
addEventListener("keydown", sendInput);
addEventListener("keyup", sendInput);

// ---- render loop ----
const camTarget = new THREE.Vector3();
function tick() {
  requestAnimationFrame(tick);
  const hips = poseCharacter(pickFrames());
  if (hips) {
    camTarget.lerp(tmpA.set(hips.x, 1.0, hips.z), 0.12);
    sun.position.set(camTarget.x + 8, 14, camTarget.z + 6);
    sun.target.position.copy(camTarget);
  }
  // yaw is measured so camera sits behind along -fwd.
  camera.position.set(
    camTarget.x + Math.cos(yaw) * Math.cos(pitch) * dist,
    camTarget.y + Math.sin(pitch) * dist,
    camTarget.z + Math.sin(yaw) * Math.cos(pitch) * dist);
  camera.lookAt(camTarget);
  renderer.render(scene, camera);
}
tick();
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
